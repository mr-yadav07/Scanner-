name: ESP Forge CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          yes | "$SDKMANAGER" --install "ndk;29.0.14206865" "platforms;android-35"
      - name: Build Android ARM64 PRoot runtime
        env:
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: bash tools/native/build-proot.sh arm64-v8a
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Verify native runtime is packaged in APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libproot.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libproot-loader.so'
      - uses: actions/upload-artifact@v4
        with:
          name: esp-forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest
      - run: pytest backend/tests -q
      - run: python -m compileall -q backend/app

  board-smoke-tests:
    name: Board compile · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arduino Uno
            core: arduino:avr
            fqbn: arduino:avr:uno
            options: ""
            indexes: ""
          - name: ESP32
            core: esp32:esp32
            fqbn: esp32:esp32:esp32
            options: ""
            indexes: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          - name: ESP32-S3
            core: esp32:esp32
            fqbn: esp32:esp32:esp32s3
            options: ""
            indexes: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          - name: ESP8266
            core: esp8266:esp8266
            fqbn: esp8266:esp8266:nodemcuv2
            options: ""
            indexes: "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
          - name: STM32 Blue Pill F103C8
            core: STMicroelectronics:stm32
            fqbn: STMicroelectronics:stm32:GenF1
            options: "pnum=BLUEPILL_F103C8"
            indexes: "https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json"
          - name: WCH CH32V003F4
            core: WCH:ch32v
            fqbn: WCH:ch32v:CH32V00x_EVT
            options: "pnum=CH32V003F4"
            indexes: "https://github.com/openwch/board_manager_files/raw/main/package_ch32v_index.json"
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz | sudo tar -xz -C /usr/local/bin arduino-cli
      - name: Configure board package indexes
        env:
          EXTRA_INDEX: ${{ matrix.indexes }}
        run: |
          mkdir -p "$HOME/.arduino15"
          if [ -n "$EXTRA_INDEX" ]; then
            printf 'board_manager:\n  additional_urls:\n    - %s\n' "$EXTRA_INDEX" > "$HOME/.arduino15/arduino-cli.yaml"
          fi
          arduino-cli core update-index
      - name: Install board core
        run: arduino-cli core install "${{ matrix.core }}"
      - name: Compile smoke sketch
        env:
          FQBN: ${{ matrix.fqbn }}
          BOARD_OPTIONS: ${{ matrix.options }}
        run: |
          mkdir -p /tmp/espforge-smoke
          cat > /tmp/espforge-smoke/espforge-smoke.ino <<'EOF'
          #include <Arduino.h>
          void setup() { }
          void loop() { }
          EOF
          if [ -n "$BOARD_OPTIONS" ]; then
            arduino-cli compile --fqbn "$FQBN" --board-options "$BOARD_OPTIONS" /tmp/espforge-smoke
          else
            arduino-cli compile --fqbn "$FQBN" /tmp/espforge-smoke
          fi
